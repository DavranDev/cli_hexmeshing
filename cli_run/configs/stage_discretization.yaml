# Discretization-only run (Pipeline Stage 2).
#
# Input HDF5 must already contain a polycube (post-decomposition state).
# Produces stage_2_discretization.hdf5 in the run directory.
#
# Placeholders __INPUT_PATH__ and __RUN_DIR__ are substituted by cli_run/run.sh.

input:
  type: hdf5
  path: __INPUT_PATH__

stages:
  - discretization:
      hex_size: 0.05            # edge length of one hex element
      round_to_nearest: false   # snap cuboid bounds to integer grid (vs expand)
      padding: true             # add an extra layer of hexes globally

output:
  run_dir: __RUN_DIR__

keep_window_open: true
