# Hexahedralization-only run (Pipeline Stage 3).
#
# Input HDF5 must already contain a polycube_complex (post-discretization).
# Produces stage_3_hexahedralization.hdf5 + result.mesh in the run directory.
#
# Placeholders /space/output/runs/toy_plane/hexahedralization_2026_05_08_001/input.hdf5 and /space/output/runs/toy_plane/hexahedralization_2026_05_08_001 are substituted by cli/run.sh.

input:
  type: hdf5
  path: /space/output/runs/toy_plane/hexahedralization_2026_05_08_001/input.hdf5

stages:
  - hexahedralization:
      inversion_free: true      # use the smooth-deformation init (200 internal steps)
      projection_weight: 1.0    # pull boundary verts toward input surface
      hausdorff_weight: 1.0     # reduce worst-case surface distance
      fairness_weight: 0.0      # Laplacian smoothness on boundary
      smoothness_weight: 1.0    # normal smoothness
      learning_rate: 1.0e-4
      steps: 100                # extra optimization steps after init

output:
  run_dir: /space/output/runs/toy_plane/hexahedralization_2026_05_08_001
  export_mesh: result.mesh      # MEDIT-format final hex mesh (relative to run_dir)

keep_window_open: true
