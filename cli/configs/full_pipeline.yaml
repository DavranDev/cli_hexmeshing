# Full pipeline run: Discretization + Hexahedralization (Stages 2+3).
#
# Input HDF5 must already contain a polycube (post-decomposition state).
# Produces stage_2_discretization.hdf5, stage_3_hexahedralization.hdf5, and
# result.mesh in the run directory.
#
# (Stages 0 and 1 — Deformation, Decomposition — are not yet wired into the
# script runner. For now, run them in the GUI once and save an HDF5 to feed
# into this pipeline.)
#
# Placeholders __INPUT_PATH__ and __RUN_DIR__ are substituted by cli/run.sh.

input:
  type: hdf5
  path: __INPUT_PATH__

stages:
  - discretization:
      hex_size: 0.05
      round_to_nearest: false
      padding: true

  - hexahedralization:
      inversion_free: true
      projection_weight: 1.0
      hausdorff_weight: 1.0
      fairness_weight: 0.0
      smoothness_weight: 1.0
      learning_rate: 1.0e-4
      steps: 100

output:
  run_dir: __RUN_DIR__
  export_mesh: result.mesh

keep_window_open: true
